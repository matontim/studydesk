<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyDesk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login-screen">
    <h1>StudyDesk</h1>
    <div id="login-form">
        <h2>Sign In</h2>
        <label for="login-username">👤 Username</label>
        <input type="text" id="login-username" placeholder="Username" />
        <label for="login-password">🔒 Password</label>
        <input type="password" id="login-password" placeholder="Password" />
        <button id="btn-login">Log In</button>
        <button id="btn-show-register">Create Account</button>
    </div>
    <div id="register-form" style="display:none">
        <h2>Create an Account</h2>
        <label for="reg-username">👤 Choose a Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username" />
        <label for="reg-password">🔒 Choose a Password</label>
        <input type="password" id="reg-password" placeholder="Choose a password" />
        <button id="btn-register">Register</button>
        <button id="btn-show-login">Back to Login</button>
    </div>
    <p id="auth-message"></p>
</div>

<div id="app" style="display:none">
<div class="wall">
    <div class="binder-shelf"></div>

    <div class="shelf">
        <section class="paper">
            <div class="hole-punch"></div>
            <div class="hole-punch"></div>
            <div class="hole-punch"></div>
            <h1>My Assignments</h1>
            <table class="assignment-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Assignment</th>
                        <th>Subject/Course</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <form id="add-form">
                <input type="text" id="input-name" placeholder="Assignment name" />
                <input type="text" id="input-subject" placeholder="Subject" />
                <input type="date" id="input-due" />
                <select id="input-priority">
                    <option value="high">High</option>
                    <option value="med">Medium</option>
                    <option value="low">Low</option>
                </select>
                <button type="submit">ADD</button>
            </form>
        </section>
        <div class="sidebar">
            <section class="bulletin-board">
                <h2>Due Soon</h2>
            </section>
            <section class="calendar">
                <div class="calendar-header">
                    <h2>Calendar</h2>
                    <div class="cal-toggle">
                        <button id="btn-week" class="active">Week</button>
                        <button id="btn-month">Month</button>
                    </div>
                </div>
                <div id="calendar-grid"></div>
            </section>
        </div>
    </div>
</div>
</div>
<script src="script.js"></script>
</body>
