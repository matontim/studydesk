<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyDesk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wall">
    <div class="binder-shelf"></div>

    <div class="shelf">
        <section class="paper">
            <div class="hole-punch"></div>
            <div class="hole-punch"></div>
            <div class="hole-punch"></div>
            <h1>My Assignments</h1>
            <table class="assignment-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Assignment</th>
                        <th>Subject/Course</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <form id="add-form">
                <input type="text" id="input-name" placeholder="Assignment name" />
                <input type="text" id="input-subject" placeholder="Subject" />
                <input type="date" id="input-due" />
                <select id="input-priority">
                    <option value="high">High</option>
                    <option value="med">Medium</option>
                    <option value="low">Low</option>
                </select>
                <button type="submit">Add</button>
            </form>
        </section>
        <div class="sidebar">
            <section class="bulletin-board">
                <h2>Due Soon</h2>
            </section>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
